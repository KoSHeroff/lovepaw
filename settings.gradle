pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Auto-provisions the JDK a target needs (MC 1.21.x builds on Java 21).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        // Adding a target later is a single line here plus a matching
        // versions/<target>/gradle.properties file.
        version '1.21.1-fabric',   '1.21.1-fabric'
        version '1.21.1-neoforge', '1.21.1-neoforge'
        vcsVersion = '1.21.1-fabric'
    }
}

rootProject.name = 'lovepaw'
